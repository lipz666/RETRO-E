[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "retro-e"
version = "0.1.0"
description = "Controlled experiments for trainable synthetic-experience context in LLM retrosynthesis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "rdkit>=2024.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]
optimization = [
  "dspy>=2.6",
]

[project.scripts]
retro-e = "retro_e.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retro_e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

